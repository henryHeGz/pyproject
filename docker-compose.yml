version: '3.8'

services:
  # 主应用服务（使用SQLite）
  chinatax-scraper:
    # image: crpi-9udrgpeh6e3r59wi.cn-guangzhou.personal.cr.aliyuncs.com/test_20250806/zpaidata:0.1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chinatax-scraper
    ports:
      - "8000:8000"
    volumes:
      # 持久化数据库文件
      - ./data:/app/data
      # 持久化CSV导出文件
      - ./csv_exports:/app/csv_exports
      # 持久化下载的法律法规文档
      - ./flfg_downloads:/app/flfg_downloads
      # 持久化日志文件
      - ./logs:/app/logs
    environment:
      - DB_TYPE=sqlite
      - SQLITE_DB_PATH=/app/data/chinatax.db
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - chinatax-network

