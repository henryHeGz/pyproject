[project]
name = "chinatax-scraper"
version = "0.1.0"
description = "A Playwright scraper for the 国家税务总局法规库法律法规列表."
authors = [{ name = "AutoGenerated" }]
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "pymysql>=1.1.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flfg_scraper", "comments_scraper"]

[project.scripts]
chinatax-scraper = "chinatax_scraper:main"
chinatax-web = "web_app:main"

[tool.playwright]
# Allow `playwright install` to know which browsers to fetch.
browsers = ["chromium"]
